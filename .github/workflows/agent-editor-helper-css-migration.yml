name: Agent editor helper CSS migration

on:
  push:
    branches:
      - agent/move-editor-helper-styles-to-css

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/move-editor-helper-styles-to-css
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Migrate static editor helper styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          modules = [
              ('agent', 'assets/js/spnAgentHelper.js', 'spnAgentHelperStyles', 'Подпись специалиста'),
              ('brand', 'assets/js/spnBrandEditor.js', 'brandRowEditorStyles', 'Редактор брендовой строки'),
              ('contact', 'assets/js/spnContactEditor.js', 'contactCtaEditorStyles', 'Редактор контакта'),
              ('qr', 'assets/js/spnQrEditor.js', 'qrCaptionHelperStyles', 'Редактор QR'),
          ]

          css_parts = []
          for key, file, style_id, title in modules:
              path = Path(file)
              text = path.read_text(encoding='utf-8')
              matches = re.findall(r"style\.textContent\s*=\s*`([\s\S]*?)`;", text)
              if len(matches) != 1:
                  raise SystemExit(f'{file}: expected exactly one static style.textContent, got {len(matches)}')
              if '${' in matches[0]:
                  raise SystemExit(f'{file}: CSS is dynamic; aborting')
              css_parts.append(f'/* {title} */\n{matches[0]}\n')
              text = text.replace('  injectStyles();\n', '', 1)
              text, count = re.subn(r"\nfunction injectStyles\(\)\{[\s\S]*?(?=\nfunction |\Z)", '\n', text, count=1)
              if count != 1:
                  raise SystemExit(f'{file}: injectStyles function not removed exactly once')
              if 'injectStyles' in text or "createElement('style')" in text or style_id in text:
                  raise SystemExit(f'{file}: runtime style injection remains')
              path.write_text(text, encoding='utf-8')

          Path('assets/css/editor-helpers.css').write_text('\n'.join(css_parts), encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          link = '  <link rel="stylesheet" href="assets/css/editor-helpers.css?v=3.85.0">\n'
          anchor = '  <link rel="stylesheet" href="assets/css/field-helpers.css?v=3.85.0">\n'
          if link not in text:
              if anchor not in text:
                  raise SystemExit('index.html: field-helpers anchor not found')
              text = text.replace(anchor, anchor + link, 1)
          index.write_text(text, encoding='utf-8')

          package = Path('package.json')
          text = package.read_text(encoding='utf-8')
          script = '    "validate:editor-helper-css": "node tools/validate-editor-helper-css.mjs",\n'
          anchor = '    "validate:field-helper-css": "node tools/validate-field-helper-css.mjs",\n'
          if script not in text:
              if anchor not in text:
                  raise SystemExit('package.json: field helper validator anchor not found')
              text = text.replace(anchor, anchor + script, 1)
          package.write_text(text, encoding='utf-8')

          maintenance = Path('docs/maintenance-guide.md')
          text = maintenance.read_text(encoding='utf-8')
          line = 'npm run validate:editor-helper-css\n'
          anchor = 'npm run validate:field-helper-css\n'
          if line not in text:
              if anchor not in text:
                  raise SystemExit('maintenance guide anchor not found')
              text = text.replace(anchor, anchor + line, 1)
          if text.count('npm run validate:editor-helper-css') != 1:
              raise SystemExit('maintenance guide: validator must occur exactly once')
          maintenance.write_text(text, encoding='utf-8')
          PY

          cat > tools/validate-editor-helper-css.mjs <<'EOF'
          import fs from 'node:fs';

          const files = {
            index: 'index.html',
            css: 'assets/css/editor-helpers.css',
            agent: 'assets/js/spnAgentHelper.js',
            brand: 'assets/js/spnBrandEditor.js',
            contact: 'assets/js/spnContactEditor.js',
            qr: 'assets/js/spnQrEditor.js'
          };
          const errors = [];
          const sources = Object.fromEntries(Object.entries(files).map(([key,file]) => [key, read(file)]));

          requireSnippets(files.index, sources.index, [
            'assets/css/field-helpers.css?v=3.85.0',
            'assets/css/editor-helpers.css?v=3.85.0'
          ]);
          if(sources.index.indexOf('assets/css/editor-helpers.css?v=3.85.0') < sources.index.indexOf('assets/css/field-helpers.css?v=3.85.0')){
            errors.push('index.html: editor-helpers.css должен подключаться после field-helpers.css');
          }

          requireSnippets(files.css, sources.css, [
            '.spn-agent-helper{',
            '.spn-brand-editor{',
            '.spn-contact-editor{',
            '.spn-qr-editor{',
            '@media(max-width:520px){.spn-agent-ideas{grid-template-columns:1fr}}',
            '@media(max-width:520px){.spn-brand-editor-grid{grid-template-columns:1fr}}',
            '@media(max-width:520px){.spn-contact-presets{grid-template-columns:1fr}}',
            '@media(max-width:520px){.spn-qr-presets{grid-template-columns:1fr}}',
            '@media print{.spn-agent-helper{display:none!important}}',
            '@media print{.spn-brand-editor{display:none!important}}',
            '@media print{.spn-contact-editor{display:none!important}}',
            '@media print{.spn-qr-editor{display:none!important}}'
          ]);

          const contracts = {
            agent: ['renderNameIdeas()', 'normalizeAgentName()', 'data-agent-idea', 'toTitleCase(raw)'],
            brand: ['data-brand-name', 'data-brand-side', 'saveBrand()', 'loadBrandName()', 'setLayoutExtraValue'],
            contact: ['data-contact-cta', 'saveCta(input.value)', 'loadCta()', 'setLayoutExtraValue'],
            qr: ['data-qr-caption', 'qrCleanLinkBtn', "setChecked('showQr', true)", "setValue('qrLink', '')"]
          };
          const styleIds = {
            agent:'spnAgentHelperStyles', brand:'brandRowEditorStyles', contact:'contactCtaEditorStyles', qr:'qrCaptionHelperStyles'
          };
          for(const key of ['agent','brand','contact','qr']){
            requireSnippets(files[key], sources[key], contracts[key]);
            forbidSnippets(files[key], sources[key], ['injectStyles', "createElement('style')", 'createElement("style")', styleIds[key]]);
          }

          if(errors.length){
            console.error('\nОшибки CSS редакторов полей:');
            errors.forEach(error => console.error(`- ${error}`));
            process.exit(1);
          }
          console.log('Проверка CSS редакторов полей пройдена.');

          function read(file){
            if(!fs.existsSync(file)){ errors.push(`${file}: файл отсутствует`); return ''; }
            return fs.readFileSync(file,'utf8');
          }
          function requireSnippets(file, source, snippets){
            for(const snippet of snippets) if(!source.includes(snippet)) errors.push(`${file}: отсутствует ${snippet}`);
          }
          function forbidSnippets(file, source, snippets){
            for(const snippet of snippets) if(source.includes(snippet)) errors.push(`${file}: найден запрещённый фрагмент — ${snippet}`);
          }
          EOF

          npm run runtime:registry
          npm run validate:editor-helper-css
          npm run validate
          node --check assets/js/spnAgentHelper.js
          node --check assets/js/spnBrandEditor.js
          node --check assets/js/spnContactEditor.js
          node --check assets/js/spnQrEditor.js
          node --check tools/validate-editor-helper-css.mjs
          git diff --check

          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'Migration already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/editor-helpers.css assets/js/spnAgentHelper.js assets/js/spnBrandEditor.js assets/js/spnContactEditor.js assets/js/spnQrEditor.js data/runtime-modules.json docs/maintenance-guide.md index.html package.json tools/validate-editor-helper-css.mjs
          git commit -m 'style: перенести стили редакторов полей в CSS'
          git push origin HEAD:agent/move-editor-helper-styles-to-css

name: Agent field helper CSS migration

on:
  push:
    branches:
      - agent/move-field-helper-styles-to-css

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/move-field-helper-styles-to-css
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Migrate static field helper styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          modules = [
              ('area', 'assets/js/spnAreaHelper.js', 'spnAreaHelperStyles', 'Район / адрес'),
              ('params', 'assets/js/spnParamsHelper.js', 'spnParamsHelperStyles', 'Параметры объекта'),
              ('phone', 'assets/js/spnPhoneHelper.js', 'spnPhoneHelperStyles', 'Телефон'),
              ('price', 'assets/js/spnPriceHelper.js', 'spnPriceHelperStyles', 'Цена / бюджет'),
          ]

          css_parts = []
          for key, file, style_id, title in modules:
              path = Path(file)
              text = path.read_text(encoding='utf-8')
              matches = re.findall(r"style\.textContent\s*=\s*`([\s\S]*?)`;", text)
              if len(matches) != 1:
                  raise SystemExit(f'{file}: expected exactly one static style.textContent, got {len(matches)}')
              if '${' in matches[0]:
                  raise SystemExit(f'{file}: CSS is dynamic; aborting')
              css_parts.append(f'/* {title} */\n{matches[0]}\n')
              text = text.replace('  injectStyles();\n', '', 1)
              text, count = re.subn(r"\nfunction injectStyles\(\)\{[\s\S]*?(?=\nfunction |\Z)", '\n', text, count=1)
              if count != 1:
                  raise SystemExit(f'{file}: injectStyles function not removed exactly once')
              if 'injectStyles' in text or "createElement('style')" in text or style_id in text:
                  raise SystemExit(f'{file}: runtime style injection remains')
              path.write_text(text, encoding='utf-8')

          Path('assets/css/field-helpers.css').write_text('\n'.join(css_parts), encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          link = '  <link rel="stylesheet" href="assets/css/field-helpers.css?v=3.85.0">\n'
          anchor = '  <link rel="stylesheet" href="assets/css/quality-runtime.css?v=3.85.0">\n'
          if link not in text:
              if anchor not in text:
                  raise SystemExit('index.html: quality-runtime anchor not found')
              text = text.replace(anchor, anchor + link, 1)
          index.write_text(text, encoding='utf-8')

          package = Path('package.json')
          text = package.read_text(encoding='utf-8')
          script = '    "validate:field-helper-css": "node tools/validate-field-helper-css.mjs",\n'
          anchor = '    "validate:template-library-css": "node tools/validate-template-library-css.mjs",\n'
          if script not in text:
              if anchor not in text:
                  raise SystemExit('package.json: template library validator anchor not found')
              text = text.replace(anchor, anchor + script, 1)
          package.write_text(text, encoding='utf-8')

          maintenance = Path('docs/maintenance-guide.md')
          text = maintenance.read_text(encoding='utf-8')
          line = 'npm run validate:field-helper-css\n'
          anchor = 'npm run validate:template-library-css\n'
          if line not in text:
              if anchor not in text:
                  raise SystemExit('maintenance guide anchor not found')
              text = text.replace(anchor, anchor + line, 1)
          if text.count('npm run validate:field-helper-css') != 1:
              raise SystemExit('maintenance guide: validator must occur exactly once')
          maintenance.write_text(text, encoding='utf-8')
          PY

          cat > tools/validate-field-helper-css.mjs <<'EOF'
          import fs from 'node:fs';

          const files = {
            index: 'index.html',
            css: 'assets/css/field-helpers.css',
            area: 'assets/js/spnAreaHelper.js',
            params: 'assets/js/spnParamsHelper.js',
            phone: 'assets/js/spnPhoneHelper.js',
            price: 'assets/js/spnPriceHelper.js'
          };
          const errors = [];
          const sources = Object.fromEntries(Object.entries(files).map(([key,file]) => [key, read(file)]));

          requireSnippets(files.index, sources.index, [
            'assets/css/quality-runtime.css?v=3.85.0',
            'assets/css/field-helpers.css?v=3.85.0'
          ]);
          if(sources.index.indexOf('assets/css/field-helpers.css?v=3.85.0') < sources.index.indexOf('assets/css/quality-runtime.css?v=3.85.0')){
            errors.push('index.html: field-helpers.css должен подключаться после quality-runtime.css');
          }

          requireSnippets(files.css, sources.css, [
            '.spn-area-helper{',
            '.spn-params-helper{',
            '.spn-phone-helper{',
            '.spn-price-helper{',
            '@media(max-width:520px){.spn-area-presets,.spn-area-context{grid-template-columns:1fr}}',
            '@media(max-width:520px){.spn-params-ideas{grid-template-columns:1fr}}',
            '@media(max-width:520px){.spn-phone-actions{grid-template-columns:1fr}}',
            '@media(max-width:520px){.spn-price-ideas{grid-template-columns:1fr}}',
            '@media print{.spn-area-helper{display:none!important}}',
            '@media print{.spn-params-helper{display:none!important}}',
            '@media print{.spn-phone-helper{display:none!important}}',
            '@media print{.spn-price-helper{display:none!important}}'
          ]);

          const contracts = {
            area: ['data-area-value', 'data-area-context', 'putAreaToHeadline()', "setChecked('showMeta', true)"],
            params: ['getIdeas()', 'housePresets', 'landPresets', 'commercialPresets', "setChecked('showMeta', false)"],
            phone: ['normalizeRussianPhone(raw)', 'showPhoneEverywhere()', 'showTearsOnly()', "setChecked('tearOffs', true)"],
            price: ['renderPriceIdeas()', 'normalizeAmount(raw)', 'data-price-idea', "setChecked('showPrice', false)"]
          };
          const styleIds = {
            area:'spnAreaHelperStyles', params:'spnParamsHelperStyles', phone:'spnPhoneHelperStyles', price:'spnPriceHelperStyles'
          };
          for(const key of ['area','params','phone','price']){
            requireSnippets(files[key], sources[key], contracts[key]);
            forbidSnippets(files[key], sources[key], ['injectStyles', "createElement('style')", 'createElement("style")', styleIds[key]]);
          }

          if(errors.length){
            console.error('\nОшибки CSS помощников полей:');
            errors.forEach(error => console.error(`- ${error}`));
            process.exit(1);
          }
          console.log('Проверка CSS помощников полей пройдена.');

          function read(file){
            if(!fs.existsSync(file)){ errors.push(`${file}: файл отсутствует`); return ''; }
            return fs.readFileSync(file,'utf8');
          }
          function requireSnippets(file, source, snippets){
            for(const snippet of snippets) if(!source.includes(snippet)) errors.push(`${file}: отсутствует ${snippet}`);
          }
          function forbidSnippets(file, source, snippets){
            for(const snippet of snippets) if(source.includes(snippet)) errors.push(`${file}: найден запрещённый фрагмент — ${snippet}`);
          }
          EOF

          npm run runtime:registry
          npm run validate:field-helper-css
          npm run validate
          node --check assets/js/spnAreaHelper.js
          node --check assets/js/spnParamsHelper.js
          node --check assets/js/spnPhoneHelper.js
          node --check assets/js/spnPriceHelper.js
          node --check tools/validate-field-helper-css.mjs
          git diff --check

          if git diff --quiet && git ls-files --others --exclude-standard | grep -q .; then
            :
          fi
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'Migration already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/field-helpers.css assets/js/spnAreaHelper.js assets/js/spnParamsHelper.js assets/js/spnPhoneHelper.js assets/js/spnPriceHelper.js data/runtime-modules.json docs/maintenance-guide.md index.html package.json tools/validate-field-helper-css.mjs
          git commit -m 'style: перенести стили помощников полей в CSS'
          git push origin HEAD:agent/move-field-helper-styles-to-css

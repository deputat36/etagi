name: Agent PR114 maintenance fix

on:
  push:
    branches:
      - agent/move-template-library-styles-to-css

permissions:
  contents: write

jobs:
  patch-maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/move-template-library-styles-to-css
          fetch-depth: 0
      - name: Add template library validator to maintenance list
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/maintenance-guide.md')
          text = path.read_text(encoding='utf-8')
          needle = 'npm run validate:layout-mode-accessibility\n'
          line = 'npm run validate:template-library-css\n'
          if line not in text:
              if needle not in text:
                  raise SystemExit('anchor not found')
              text = text.replace(needle, needle + line, 1)
              path.write_text(text, encoding='utf-8')
          if path.read_text(encoding='utf-8').count('npm run validate:template-library-css') != 1:
              raise SystemExit('validator command must occur exactly once')
          PY
          if git diff --quiet -- docs/maintenance-guide.md; then
            echo 'Maintenance guide already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/maintenance-guide.md
          git commit -m 'docs: добавить validator CSS библиотеки в регламент'
          git push origin HEAD:agent/move-template-library-styles-to-css

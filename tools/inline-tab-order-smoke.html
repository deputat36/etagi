<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Etagi inline tab order smoke</title>
  <style>
    body{font-family:Arial,sans-serif;margin:16px}
    #appFrame{width:1280px;height:900px;border:1px solid #cbd5e1}
    #uiActionsSmokeResult{white-space:pre-wrap;padding:12px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc}
  </style>
</head>
<body>
  <pre id="uiActionsSmokeResult" data-status="pending">Inline tab order smoke is running…</pre>
  <iframe id="appFrame" title="Генератор расклеек"></iframe>
  <script>
    const result = document.getElementById('uiActionsSmokeResult');
    const frame = document.getElementById('appFrame');
    const checks = [];
    const runtimeErrors = [];
    let lastAction = 'startup';

    frame.addEventListener('load', async () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const earlyErrors = Array.isArray(win.__ETAGI_EARLY_ERRORS__) ? [...win.__ETAGI_EARLY_ERRORS__] : [];
      runtimeErrors.push(...earlyErrors);
      win.addEventListener('error', event => runtimeErrors.push(event.message || 'window error'));
      win.addEventListener('unhandledrejection', event => runtimeErrors.push(String(event.reason || 'unhandled rejection')));

      try{
        await waitFor(() => doc.querySelectorAll('.tpl-card').length > 0, 12000, 'шаблоны не появились');
        await waitFor(() => doc.querySelector('#printSheet .flyer'), 12000, 'предпросмотр А4 не появился');

        lastAction = 'inline-tab.four-copies';
        setField(win, doc, '#headline', 'Заголовок для Tab-пути');
        setField(win, doc, '#description', 'Описание для проверки клавиатурного маршрута.');
        setField(win, doc, '#benefits', 'Первое преимущество\nВторое преимущество');
        setField(win, doc, '#area', 'Центр');
        setField(win, doc, '#propertyType', 'Квартира');
        setField(win, doc, '#price', '4 900 000 ₽');
        setField(win, doc, '#agentName', 'Анна Tab');
        setField(win, doc, '#agentPhone', '+7 900 321-45-67');
        click(doc, '[data-count="4"]');

        await waitFor(() => doc.querySelectorAll('#printSheet .flyer').length === 4, 4000, 'не появились четыре копии макета');
        const flyers = [...doc.querySelectorAll('#printSheet .flyer')];
        const firstEditables = [...flyers[0].querySelectorAll('[data-inline-field]')];
        const duplicateEditables = flyers.slice(1).flatMap(flyer => [...flyer.querySelectorAll('[data-inline-field]')]);
        assert(firstEditables.length >= 8, 'в первой копии недостаточно редактируемых полей для проверки');
        const firstTabStops = firstEditables.filter(node => node.tabIndex === 0);
        const firstTabKeys = new Set(firstTabStops.map(node => `${node.dataset.inlineField}:${node.dataset.inlineIndex || ''}`));
        assert(firstTabKeys.size === firstTabStops.length, 'в первой копии повторяются Tab-stop одинаковых полей');
        assert(firstTabKeys.size >= 8, 'из Tab-пути пропали доступные поля');
        assert(duplicateEditables.length > firstEditables.length, 'не найдены повторяющиеся поля остальных копий');
        assert(duplicateEditables.every(node => node.tabIndex === -1), 'копии макета повторно попадают в Tab-порядок');
        assert(doc.querySelectorAll('#printSheet [data-inline-field][tabindex="0"]').length === firstTabStops.length, 'число Tab-stop умножилось на количество копий');
        pass('Tab-путь: только первая копия содержит tabindex=0');

        lastAction = 'inline-tab.edit-secondary-copy';
        const secondaryHeadline = flyers[1].querySelector('[data-inline-field="headline"]');
        assert(secondaryHeadline, 'во второй копии нет редактируемого заголовка');
        assert(secondaryHeadline.isContentEditable, 'поле второй копии перестало быть contenteditable');
        assert(secondaryHeadline.tabIndex === -1, 'поле второй копии ошибочно находится в Tab-порядке');
        secondaryHeadline.focus();
        assert(doc.activeElement === secondaryHeadline, 'поле второй копии нельзя сфокусировать прямым действием');
        secondaryHeadline.textContent = 'Изменено во второй копии';
        secondaryHeadline.blur();

        const expectedHeadline = 'ИЗМЕНЕНО ВО ВТОРОЙ КОПИИ';
        await waitFor(() => doc.getElementById('headline')?.value === expectedHeadline, 3000, 'редактирование второй копии не обновило поле формы');
        await waitFor(() => [...doc.querySelectorAll('#printSheet [data-inline-field="headline"]')].every(node => node.textContent.trim() === expectedHeadline), 3000, 'редактирование второй копии не обновило остальные копии');

        const rerenderedFlyers = [...doc.querySelectorAll('#printSheet .flyer')];
        assert(rerenderedFlyers[0].querySelectorAll('[data-inline-field][tabindex="0"]').length === firstTabStops.length, 'после рендера первая копия потеряла Tab-stop');
        assert(rerenderedFlyers.slice(1).flatMap(flyer => [...flyer.querySelectorAll('[data-inline-field]')]).every(node => node.tabIndex === -1), 'после рендера повторные Tab-stop вернулись');
        pass('вторая копия: прямое редактирование сохранено вне Tab-порядка');

        lastAction = 'inline-text.brand-and-tears';
        for(const [field, inputId, value] of [
          ['brandName', 'brandNameText', 'Этажи Борисоглебск'],
          ['brandSideText', 'brandSideText', 'Борисоглебск'],
          ['tearOffLabel', 'tearOffLabel', 'Район Центр']
        ]){
          const editable = doc.querySelector(`#printSheet [data-inline-field="${field}"]`);
          assert(editable?.getAttribute('aria-label'), `${field}: поле не имеет понятного имени`);
          editable.focus();
          editable.textContent = value;
          editable.blur();
          await waitFor(() => doc.getElementById(inputId)?.value === value, 2000, `${field}: значение не передано в форму`);
          const copies = [...doc.querySelectorAll(`#printSheet [data-inline-field="${field}"]`)];
          assert(copies.length >= 4 && copies.every(node => (node.innerText || node.textContent).replace(/\s+/g, ' ').trim() === (field === 'tearOffLabel' ? value.toUpperCase() : value)), `${field}: не все копии обновились`);
        }
        const tearLabel = doc.querySelector('#printSheet [data-inline-field="tearOffLabel"]');
        const labelMarkup = tearLabel.innerHTML;
        tearLabel.focus();
        assert(tearLabel.textContent === 'Район Центр', 'при редактировании отрывного потерян исходный текст');
        tearLabel.textContent = 'Отменить изменение';
        tearLabel.dispatchEvent(new win.KeyboardEvent('keydown', {key:'Escape', bubbles:true, cancelable:true}));
        assert(doc.getElementById('tearOffLabel').value === 'Район Центр' && tearLabel.innerHTML === labelMarkup, 'Esc не вернул надпись и оформление отрывного');

        const tearPhone = doc.querySelectorAll('#printSheet .flyer')[1].querySelector('.tear-phone');
        tearPhone.focus();
        tearPhone.textContent = '+7 900 777-88-99';
        tearPhone.blur();
        await waitFor(() => doc.getElementById('agentPhone')?.value === '+7 900 777-88-99', 2000, 'телефон из отрывного не обновил форму');
        assert([...doc.querySelectorAll('#printSheet [data-inline-field="agentPhone"]')].every(node => node.textContent.trim() === '+7 900 777-88-99'), 'телефон не обновился во всех контактах и отрывных');
        pass('фирменная строка и отрывные: прямое редактирование, все копии и отмена');

        setField(win, doc, '#layoutName', 'Inline brand and tears');
        click(doc, '#saveNamedLayoutBtn');
        const savedId = doc.getElementById('savedLayouts').value;
        assert(savedId, 'прямые изменения не сохранены');
        setField(win, doc, '#brandSideText', 'Временная подпись');
        doc.getElementById('savedLayouts').value = savedId;
        click(doc, '#loadNamedLayoutBtn');
        assert(doc.getElementById('brandSideText').value === 'Борисоглебск' && doc.getElementById('tearOffLabel').value === 'Район Центр', 'повторное открытие потеряло прямые изменения');
        pass('прямые изменения фирменной строки и отрывных сохраняются в макете');

        lastAction = 'inline-focus.transitions';
        for(const width of [1280, 360, 390, 430]){
          frame.style.width = `${width}px`;
          for(const mode of ['quick', 'newbie', 'advanced']){
            click(doc, `button[data-spn-ui-mode="${mode}"]`);
            setField(win, doc, '#description', 'Описание для точного курсора.');
            const source = doc.querySelector('#printSheet [data-inline-field="headline"]');
            source.focus();
            source.textContent = `ПЕРЕХОД ${width} ${mode}`;
            const target = doc.querySelector('#printSheet [data-inline-field="description"]');
            target.scrollIntoView({block:'center'});
            const caret = doc.createRange();
            caret.setStart(target.firstChild, 8);
            caret.setEnd(target.firstChild, 9);
            const rect = caret.getBoundingClientRect();
            const clientX = rect.left + .1;
            const clientY = rect.top + rect.height / 2;
            const point = doc.caretPositionFromPoint?.(clientX, clientY);
            const fallback = point ? null : doc.caretRangeFromPoint(clientX, clientY);
            const expectedOffset = point?.offset ?? fallback.startOffset;
            target.dispatchEvent(new win.PointerEvent('pointerdown', {button:0, clientX, clientY, bubbles:true}));
            target.focus();
            await Promise.resolve();
            assert(doc.activeElement?.dataset.inlineField === 'description', 'поле не готово к вводу сразу после перехода');
            assert(doc.getElementById('spnPreviewBlockName').textContent === 'Описание', 'действия предпросмотра выбрали другой блок');
            await waitFor(() => doc.activeElement?.dataset.inlineField === 'description' && doc.activeElement.isConnected, 2000, 'переход потерял фокус соседнего поля');
            const current = doc.activeElement;
            assert(doc.getSelection().anchorNode === current.firstChild && doc.getSelection().anchorOffset === expectedOffset, 'переход изменил позицию курсора');
            assert(doc.getElementById('headline').value === `ПЕРЕХОД ${width} ${mode.toUpperCase()}`, 'переход потерял предыдущий текст');
            current.textContent = `Описание ${width} ${mode}`;
            const secondary = doc.querySelectorAll('#printSheet .flyer')[1].querySelector('[data-inline-field="headline"]');
            secondary.focus();
            await waitFor(() => doc.activeElement === doc.querySelectorAll('#printSheet .flyer')[1].querySelector('[data-inline-field="headline"]'), 2000, 'переход в другую копию выбрал неверное поле');
            assert(doc.getElementById('description').value === `Описание ${width} ${mode}`, 'обратный переход потерял описание');
            doc.activeElement.blur();
          }
        }
        pass('переходы между текстами: фокус, курсор и копия макета сохраняются');

        lastAction = 'inline-focus.removed-benefit';
        setField(win, doc, '#benefits', 'Первое\nВторое\nТретье');
        const firstBenefit = doc.querySelector('#printSheet [data-inline-field="benefits"][data-inline-index="0"]');
        firstBenefit.focus();
        firstBenefit.textContent = '';
        doc.querySelector('#printSheet [data-inline-field="benefits"][data-inline-index="1"]').focus();
        await waitFor(() => doc.activeElement?.dataset.inlineField === 'benefits' && doc.activeElement.textContent === 'Второе', 2000, 'удаление преимущества перевело фокус в другую строку');
        assert(doc.activeElement.dataset.inlineIndex === '0', 'не учтён сдвиг строк после удаления преимущества');
        const unchanged = doc.activeElement;
        doc.querySelector('#printSheet [data-inline-field="headline"]').focus();
        assert(unchanged.isConnected, 'переход без изменения вызвал лишнюю перерисовку');
        doc.activeElement.blur();
        pass('удаление преимущества сохраняет выбранную строку; пустой переход не перерисовывает лист');

        if(runtimeErrors.length) throw new Error(`runtime errors: ${runtimeErrors.join(' | ')}`);
        lastAction = 'completed';
        result.dataset.status = 'passed';
        result.textContent = `PASSED\n${checks.map(item => `✓ ${item}`).join('\n')}`;
      } catch(error){
        result.dataset.status = 'failed';
        result.dataset.lastAction = lastAction;
        result.textContent = `FAILED\n${checks.map(item => `✓ ${item}`).join('\n')}\n✗ ${error.message || error}\nПоследнее действие: ${lastAction}\nСостояние: ${JSON.stringify(snapshot(doc))}`;
      }
    }, {once:true});

    frame.src = '/index.html?smoke=inline-tab-order';

    window.setTimeout(() => {
      if(result.dataset.status === 'pending'){
        result.dataset.status = 'failed';
        result.dataset.lastAction = lastAction;
        result.textContent = `FAILED\n${checks.map(item => `✓ ${item}`).join('\n')}\n✗ timeout inline tab order smoke\nПоследнее действие: ${lastAction}`;
      }
    }, 22000);

    function pass(message){ checks.push(message); }
    function assert(condition, message){ if(!condition) throw new Error(message); }
    function click(doc, selector){
      const element = doc.querySelector(selector);
      assert(element, `не найден элемент ${selector}`);
      element.click();
    }
    function setField(win, doc, selector, value){
      const input = doc.querySelector(selector);
      assert(input, `не найден элемент ${selector}`);
      input.value = value;
      input.dispatchEvent(new win.Event('input', {bubbles:true}));
      input.dispatchEvent(new win.Event('change', {bubbles:true}));
    }
    function snapshot(doc){
      const flyers = [...doc.querySelectorAll('#printSheet .flyer')];
      return {
        status:doc.getElementById('statusLine')?.textContent || '',
        headline:doc.getElementById('headline')?.value || '',
        flyerCount:flyers.length,
        tabStops:flyers.map(flyer => [...flyer.querySelectorAll('[data-inline-field]')].map(node => node.tabIndex))
      };
    }
    function waitFor(check, timeoutMs, message){
      const started = Date.now();
      return new Promise((resolve, reject) => {
        const tick = () => {
          try{
            if(check()) return resolve();
          } catch(error){
            return reject(error);
          }
          if(Date.now() - started >= timeoutMs) return reject(new Error(message));
          setTimeout(tick, 50);
        };
        tick();
      });
    }
  </script>
</body>
</html>

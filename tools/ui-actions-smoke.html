<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <base href="/">
  <title>Etagi UI actions smoke</title>
  <style>
    body{font-family:Arial,sans-serif;margin:16px}
    #appFrame{width:1280px;height:900px;border:1px solid #cbd5e1}
    #uiActionsSmokeResult{white-space:pre-wrap;padding:12px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc}
  </style>
</head>
<body>
  <pre id="uiActionsSmokeResult" data-status="pending">UI actions smoke is running…</pre>
  <iframe id="appFrame" title="Генератор расклеек"></iframe>
  <script>
    const result = document.getElementById('uiActionsSmokeResult');
    const frame = document.getElementById('appFrame');
    const checks = [];
    const runtimeErrors = [];
    let lastAction = 'startup';

    frame.addEventListener('load', async () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const earlyErrors = Array.isArray(win.__ETAGI_EARLY_ERRORS__) ? [...win.__ETAGI_EARLY_ERRORS__] : [];
      runtimeErrors.push(...earlyErrors);
      win.addEventListener('error', event => runtimeErrors.push(event.message || 'window error'));
      win.addEventListener('unhandledrejection', event => runtimeErrors.push(String(event.reason || 'unhandled rejection')));

      try {
        await waitFor(() => doc.querySelectorAll('.tpl-card').length > 0, 12000, 'шаблоны не появились');
        await waitFor(() => doc.querySelector('#printSheet .flyer'), 12000, 'предпросмотр А4 не появился');
        await waitFor(() => doc.getElementById('contactCtaText') && doc.getElementById('tearOffLabel') && doc.getElementById('brandNameText') && doc.getElementById('brandSideText'), 5000, 'редакторы служебных подписей не появились');
        await waitFor(() => doc.getElementById('spnWorkspaceBackup'), 5000, 'полная копия рабочего пространства не появилась');
        const saveCard = doc.querySelector('.save-card');
        assert(saveCard?.querySelector('.step-title')?.textContent.includes('Сохранение и перенос'), 'раздел не объясняет общее назначение');
        for(const section of ['current','named','layout-file','workspace']) assert(saveCard?.querySelector(`[data-save-transfer-section="${section}"]`), `не найден способ сохранения ${section}`);
        assert(saveCard?.textContent.includes('Автосохранение работает в этом браузере'), 'не объяснено автосохранение текущей работы');
        assert(doc.getElementById('saveLocalBtn')?.textContent.trim() === 'Сохранить ручной резерв', 'не объяснён ручной резерв');
        assert(doc.getElementById('saveNamedLayoutBtn')?.textContent.includes('Мои макеты'), 'не объяснены именованные макеты');
        assert(doc.getElementById('downloadBtn')?.textContent.trim() === 'Скачать один макет', 'файл одного макета назван неоднозначно');
        assert(doc.getElementById('exportWorkspaceBackupBtn')?.textContent.trim() === 'Скачать полную копию', 'полная копия названа неоднозначно');
        pass('сохранение и перенос: четыре назначения объяснены отдельно');
        win.localStorage.removeItem('etagi-raskleyka-profile-v1');
        win.localStorage.removeItem('etagi-raskleyka-saved-v1');
        win.localStorage.removeItem('etagi-raskleyka-layouts-v1');

        lastAction = 'navigation.compact';
        await waitFor(() => doc.querySelector('.sidebar.spn-main-navigation'), 3000, 'единая навигация не включилась');
        const navigation = doc.getElementById('spnWizardFlow');
        const navigationMap = navigation.querySelector('.spn-wizard-map');
        const navigationFormat = navigation.querySelector('.spn-wizard-format');
        const navigationHelp = navigation.querySelector('.spn-wizard-help');
        const navigationProfile = ['agentName','agentPhone'].map(id => doc.getElementById(id).value);
        const navigationPrint = win.print;
        let navigationPrintRequests = 0;
        win.print = () => { navigationPrintRequests += 1; };
        try{
          assert([navigationMap,navigationFormat,navigationHelp].every(node => node?.tagName === 'DETAILS' && !node.open), 'дополнительная навигация не свёрнута');
          for(const width of [1363,1280,360,390,430]){
            frame.style.width = `${width}px`;
            for(const mode of ['quick','newbie','advanced']){
              click(doc, `button[data-spn-ui-mode="${mode}"]`);
              click(doc, '#spnWizardFlow [data-wizard-step="goal"]');
              await new Promise(resolve => win.requestAnimationFrame(() => win.requestAnimationFrame(resolve)));
              for(const selector of ['#spnRoute','.spn-clarity-steps','#spnClarityProgress']){
                assert(doc.querySelector(selector).getBoundingClientRect().height === 0, `${mode}/${width}: показан второй маршрут ${selector}`);
              }
              assert(navigation.getBoundingClientRect().height < 400, `${mode}/${width}: стартовая навигация снова перегружена`);
              click(doc, '#spnWizardFlow .spn-wizard-map > summary');
              assert(navigationMap.open, 'карта шагов не раскрылась');
              const visibleSteps = [...navigation.querySelectorAll('[data-wizard-step]')].filter(node => node.getBoundingClientRect().height > 0);
              assert(visibleSteps.length === (mode === 'newbie' ? 7 : 8), `${mode}: потерян доступ к шагам`);
              assert(visibleSteps.every(node => node.getBoundingClientRect().height >= 44), 'кнопки шагов слишком малы для касания');
              click(doc, '#spnWizardFlow [data-wizard-step="content"]');
              assert(!navigationMap.open && doc.activeElement === navigationMap.querySelector('summary'), 'выбор шага не свернул карту с сохранением фокуса');
              assert(navigationMap.querySelector('summary').textContent.includes('3. Адаптация'), 'заголовок не показывает текущий шаг');
              assert(navigation.querySelector('[data-wizard-step="content"]').getAttribute('aria-current') === 'step', 'текущий шаг недоступен скринридеру');
              click(doc, '#spnWizardFlow .spn-wizard-format > summary');
              click(doc, '#spnWizardFlow [data-wizard-print-count="2"]');
              assert(doc.querySelector('#printPresetRow [data-count="2"]').classList.contains('active'), 'формат не применился через существующие настройки');
              click(doc, '#printPresetRow [data-count="3"]');
              await waitFor(() => navigationFormat.querySelector('summary').textContent.includes('3 на А4'), 1500, 'формат, выбранный в печати, не обновил свёрнутый заголовок');
              click(doc, '#spnWizardFlow .spn-wizard-format > summary');
              click(doc, '#spnWizardFlow .spn-wizard-help > summary');
              assert(navigationHelp.open && doc.getElementById('spnWizardStepHelp').getBoundingClientRect().height > 0, 'подсказка к шагу недоступна');
              click(doc, '#spnWizardFlow .spn-wizard-help > summary');
              assert(doc.querySelectorAll('#printSheet .flyer').length === 3, 'раскрытие навигации изменило формат');
              const sidebar = doc.querySelector('.sidebar');
              assert(sidebar.scrollWidth <= sidebar.clientWidth + 1 && doc.documentElement.scrollWidth <= win.innerWidth + 1, `${mode}/${width}: навигация прокручивается по горизонтали`);
              click(doc, '#printPresetRow [data-count="2"]');
              assert(['agentName','agentPhone'].every((id,i) => doc.getElementById(id).value === navigationProfile[i]), 'навигация заменила личный профиль');
            }
          }
          assert(navigationPrintRequests === 0, 'навигация запустила системную печать');
        } finally { win.print = navigationPrint; }
        frame.style.width = '1280px';
        click(doc, 'button[data-spn-ui-mode="quick"]');
        if(doc.body.dataset.wizardFlow === 'on') click(doc, '#spnWizardToggle');
        pass('навигация: один компактный маршрут, доступ ко всем шагам и фокус после выбора');
        pass('навигация: формат и профиль сохраняются, подсказки раскрываются без печати');

        lastAction = 'profile.contact-layout';
        const contactValues = ['agentName','agentPhone','contactCtaText'].map(id => [id, doc.getElementById(id).value]);
        const contactOptions = [doc.getElementById('spnAgentHelper'), doc.getElementById('spnPhoneHelper'), doc.querySelector('#contactCtaEditor .spn-contact-options')];
        assert(contactOptions.every(node => node?.tagName === 'DETAILS' && !node.open), 'дополнительные варианты контактов не свёрнуты');
        const contactGrid = doc.getElementById('agentName').closest('.field-grid');
        assert(contactGrid.children.length === 2 && [...contactGrid.children].every(node => node.tagName === 'LABEL'), 'помощники разрывают сетку имени и телефона');
        setField(win, doc, '#agentName', 'Тестовая подпись специалиста для проверки переноса');
        setField(win, doc, '#agentPhone', '+7 000 000-00-00');
        for(const width of [1363, 1280, 1050, 430, 390, 360]){
          frame.style.width = `${width}px`;
          for(const mode of ['quick','newbie','advanced']){
            click(doc, `button[data-spn-ui-mode="${mode}"]`);
            click(doc, '#spnWizardFlow [data-wizard-step="content"]');
            await new Promise(resolve => win.requestAnimationFrame(() => win.requestAnimationFrame(resolve)));
            const [nameRect, phoneRect, ctaRect] = ['agentName','agentPhone','contactCtaText'].map(id => doc.getElementById(id).getBoundingClientRect());
            assert([nameRect,phoneRect,ctaRect].every(rect => rect.width > 100), `${mode}/${width}: контактное поле скрыто или сжато`);
            assert(width > 520 ? Math.abs(nameRect.top - phoneRect.top) < 2 : phoneRect.top >= nameRect.bottom, `${mode}/${width}: нарушен порядок имени и телефона`);
            assert(ctaRect.top >= Math.max(nameRect.bottom, phoneRect.bottom), `${mode}/${width}: призыв вклинился между контактами`);
            for(const details of contactOptions){
              details.querySelector('summary').click();
              assert(details.open && details.querySelector('button').getBoundingClientRect().height > 0, `${mode}/${width}: варианты не раскрываются`);
            }
            const sidebar = doc.querySelector('.sidebar');
            assert(sidebar.scrollWidth <= sidebar.clientWidth + 1, `${mode}/${width}: горизонтальная прокрутка формы ${sidebar.scrollWidth}/${sidebar.clientWidth}`);
            assert(doc.documentElement.scrollWidth <= win.innerWidth + 1, `${mode}/${width}: горизонтальная прокрутка страницы`);
            click(doc, '#toggleHelperPanelsBtn');
            assert(doc.body.classList.contains('spn-hide-helper-panels') && doc.getElementById('contactCtaText').getBoundingClientRect().width > 100, 'скрытие подсказок скрыло поле призыва');
            setField(win, doc, '#contactCtaText', 'Тестовый призыв для проверки формы');
            const ctaCopies = [...doc.querySelectorAll('#printSheet .cta')];
            assert(ctaCopies.length > 0 && ctaCopies.every(node => node.textContent === 'Тестовый призыв для проверки формы'), 'призыв не обновился в копиях');
            click(doc, '#toggleHelperPanelsBtn');
            contactOptions.forEach(details => details.querySelector('summary').click());
            assert(doc.getElementById('agentName').value === 'Тестовая подпись специалиста для проверки переноса' && doc.getElementById('agentPhone').value === '+7 000 000-00-00', 'раскрытие вариантов заменило личные контакты');
          }
        }
        contactValues.forEach(([id,value]) => setField(win, doc, `#${id}`, value));
        frame.style.width = '1280px';
        click(doc, 'button[data-spn-ui-mode="quick"]');
        if(doc.body.dataset.wizardFlow === 'on') click(doc, '#spnWizardToggle');
        pass('контакты: поля и варианты доступны без горизонтальной прокрутки на ПК и телефоне');
        pass('контакты: скрытие подсказок сохраняет редактирование призыва и личный профиль');

        lastAction = 'profile.save';
        setField(win, doc, '#agentName', 'Анна Smoke');
        setField(win, doc, '#agentPhone', '+7 900 123-45-67');
        click(doc, '#saveProfileBtn');
        await waitFor(() => doc.getElementById('statusLine')?.textContent.includes('Профиль СПН сохранён'), 3000, 'профиль не сохранился');
        assert(win.localStorage.getItem('etagi-raskleyka-profile-v1')?.includes('Анна Smoke'), 'профиль отсутствует в localStorage');

        lastAction = 'profile.load';
        setField(win, doc, '#agentName', 'Временное имя');
        setField(win, doc, '#agentPhone', '+7 999 000-00-00');
        click(doc, '#loadProfileBtn');
        await waitFor(() => doc.getElementById('agentName')?.value === 'Анна Smoke' && doc.getElementById('agentPhone')?.value === '+7 900 123-45-67', 3000, 'профиль не восстановил имя и телефон');
        pass('profile: сохранение и загрузка');

        lastAction = 'layout.named-save';
        setField(win, doc, '#layoutName', 'Smoke именованный макет');
        setField(win, doc, '#headline', 'Заголовок именованного макета');
        setField(win, doc, '#area', 'Северный smoke');
        click(doc, '#saveNamedLayoutBtn');
        await waitFor(() => {
          const select = doc.getElementById('savedLayouts');
          return select?.value && select.options.length === 2 && doc.getElementById('statusLine')?.textContent.includes('сохранён');
        }, 3000, 'именованный макет не появился в списке');
        const namedLayoutId = doc.getElementById('savedLayouts').value;
        assert(namedLayoutId, 'именованный макет не получил id');
        assert(win.localStorage.getItem('etagi-raskleyka-layouts-v1')?.includes('Smoke именованный макет'), 'именованный макет отсутствует в localStorage');

        lastAction = 'layout.named-conflict-copy';
        setField(win, doc, '#headline', 'Изменение для отдельной копии');
        click(doc, '#saveNamedLayoutBtn');
        await waitFor(() => doc.getElementById('layoutConflictDialog')?.open, 1000, 'при совпадении названия не открыт выбор действия');
        let storedLayouts = JSON.parse(win.localStorage.getItem('etagi-raskleyka-layouts-v1') || '[]');
        assert(storedLayouts.length === 1, 'макет перезаписан до выбора действия');
        assert(storedLayouts[0]?.state?.headline === 'Заголовок именованного макета', 'исходный макет изменён до подтверждения');
        click(doc, '[data-layout-conflict-action="copy"]');
        await waitFor(() => doc.getElementById('savedLayouts')?.options.length === 3, 3000, 'отдельная копия не появилась в списке');
        storedLayouts = JSON.parse(win.localStorage.getItem('etagi-raskleyka-layouts-v1') || '[]');
        const originalAfterCopy = storedLayouts.find(item => item.id === namedLayoutId);
        const copiedLayout = storedLayouts.find(item => item.id !== namedLayoutId);
        assert(originalAfterCopy?.state?.headline === 'Заголовок именованного макета', 'сохранение копии изменило исходный макет');
        assert(copiedLayout?.name === 'Smoke именованный макет — копия', 'копия не получила понятное уникальное название');
        assert(copiedLayout?.state?.headline === 'Изменение для отдельной копии', 'копия не сохранила текущие изменения');

        lastAction = 'layout.named-conflict-update';
        setField(win, doc, '#layoutName', 'Smoke именованный макет');
        setField(win, doc, '#headline', 'Обновлённый заголовок именованного макета');
        click(doc, '#saveNamedLayoutBtn');
        await waitFor(() => doc.getElementById('layoutConflictDialog')?.open, 1000, 'повторный конфликт названия не показал выбор');
        click(doc, '[data-layout-conflict-action="update"]');
        await waitFor(() => doc.getElementById('statusLine')?.textContent.includes('обновлён'), 2000, 'существующий макет не обновлён после явного выбора');
        storedLayouts = JSON.parse(win.localStorage.getItem('etagi-raskleyka-layouts-v1') || '[]');
        assert(storedLayouts.length === 2, 'обновление существующего макета создало лишнюю запись');
        assert(storedLayouts.find(item => item.id === namedLayoutId)?.state?.headline === 'Обновлённый заголовок именованного макета', 'явное обновление не сохранило изменения');
        pass('именованные макеты: конфликт названия требует выбора');

        lastAction = 'layout.named-load';
        setField(win, doc, '#headline', 'Временный заголовок');
        setField(win, doc, '#area', 'Временный район');
        doc.getElementById('savedLayouts').value = namedLayoutId;
        click(doc, '#loadNamedLayoutBtn');
        await waitFor(() => doc.getElementById('headline')?.value === 'Обновлённый заголовок именованного макета' && doc.getElementById('area')?.value === 'Северный smoke', 3000, 'именованный макет не восстановил явно обновлённые поля');
        assert(doc.body.dataset.taskSelectionConfirmed === 'true', 'загрузка именованного макета не подтвердила задачу');
        assert(doc.body.dataset.templateSelectionConfirmed === 'true', 'загрузка именованного макета не подтвердила шаблон');
        pass('именованные макеты: сохранение и загрузка');

        lastAction = 'layout.last-save';
        setField(win, doc, '#headline', 'Заголовок последнего макета');
        setField(win, doc, '#price', '3 500 000 ₽');
        click(doc, '#saveLocalBtn');
        await waitFor(() => doc.getElementById('statusLine')?.textContent.includes('Ручной резерв текущего макета сохранён'), 3000, 'ручной резерв не сохранился');
        assert(win.localStorage.getItem('etagi-raskleyka-saved-v1')?.includes('Заголовок последнего макета'), 'последний макет отсутствует в localStorage');

        lastAction = 'layout.last-load';
        setField(win, doc, '#headline', 'Изменённый заголовок');
        setField(win, doc, '#price', '1 ₽');
        click(doc, '#loadLocalBtn');
        await waitFor(() => doc.getElementById('headline')?.value === 'Заголовок последнего макета' && doc.getElementById('price')?.value === '3 500 000 ₽', 3000, 'последний макет не восстановил поля');
        assert(doc.body.dataset.taskSelectionConfirmed === 'true' && doc.body.dataset.templateSelectionConfirmed === 'true', 'ручной резерв не подтвердил загруженный рабочий контекст');
        pass('ручной резерв: сохранение и загрузка');

        lastAction = 'object.clear';
        const objectValues = {
          layoutName:'Макет для очистки',
          area:'Южный smoke',
          propertyType:'Квартира',
          price:'4 200 000 ₽',
          params:'2 комнаты, 58 м²',
          headline:'Объект перед очисткой',
          description:'Описание объекта перед очисткой с подробностями.',
          benefits:'Тихий двор\nУдобный этаж',
          customBlockTitle:'Особое условие',
          customBlockText:'Текст дополнительного блока',
          qrLink:'https://example.com/smoke-clear-object',
          qrCaption:'Открыть объект'
        };
        for(const [id, value] of Object.entries(objectValues)) setField(win, doc, `#${id}`, value);
        setCheck(win, doc, '#showCustomBlock', true);
        setCheck(win, doc, '#showQr', true);
        doc.getElementById('savedLayouts').value = namedLayoutId;
        click(doc, '[data-block-move="down"][data-block-id="headline"]');
        await setFile(win, doc, '#photoOne', 'smoke-one.svg', '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="30"><rect width="40" height="30" fill="white"/></svg>');
        await setFile(win, doc, '#photoTwo', 'smoke-two.svg', '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="30"><rect width="40" height="30" fill="black"/></svg>');
        await waitFor(() => doc.querySelectorAll('#printSheet .photo-box img').length >= 2, 3000, 'два тестовых фото не появились в макете');
        assert(doc.querySelector('#printSheet .qr-row'), 'QR не появился перед очисткой');
        click(doc, '#clearObjectBtn');
        await waitFor(() => doc.getElementById('statusLine')?.textContent.includes('Данные объекта очищены'), 3000, 'очистка объекта не завершилась');

        const clearedIds = ['layoutName','area','propertyType','price','params','headline','description','benefits','customBlockTitle','customBlockText','qrLink','qrCaption'];
        assert(clearedIds.every(id => doc.getElementById(id)?.value === ''), 'после очистки остались объектные поля или QR');
        assert(doc.getElementById('agentName')?.value === 'Анна Smoke', 'очистка удалила имя СПН');
        assert(doc.getElementById('agentPhone')?.value === '+7 900 123-45-67', 'очистка удалила телефон СПН');
        assert(doc.getElementById('savedLayouts')?.value === '', 'после очистки остался выбран сохранённый макет');
        assert(doc.getElementById('showPhoto')?.checked === false, 'после очистки фото остаётся включённым');
        assert(doc.getElementById('showCustomBlock')?.checked === false, 'после очистки дополнительный блок остаётся включённым');
        assert(doc.querySelector('[data-photo="none"]')?.classList.contains('active'), 'после очистки не выбран режим без фото');
        assert(doc.getElementById('printSheet')?.classList.contains('sheet-photo-none'), 'предпросмотр не перешёл в режим без фото');
        assert(!doc.querySelector('#printSheet .photo-box img'), 'после очистки в макете осталось фото');
        assert(!doc.querySelector('#printSheet .qr-row'), 'после очистки в макете остался QR');
        assert(doc.querySelector('#blockOrderList [data-block-id]')?.dataset.blockId === 'headline', 'после очистки не восстановлен стандартный порядок блоков');
        pass('очистка объекта: данные, фото и QR удалены, профиль сохранён');

        lastAction = 'text.shorten-label';
        const shortenButton = doc.getElementById('makeShortBtn');
        assert(shortenButton?.textContent.trim() === 'Сократить описание', 'название команды не объясняет, какое поле изменяется');
        assert(shortenButton?.title.includes('только описание'), 'у команды нет пояснения о границах действия');
        pass('текст: название команды объясняет сокращение описания');

        lastAction = 'text.shorten-empty';
        const originalHeadline = 'Заголовок должен сохраниться';
        const originalBenefits = 'Преимущество не должно измениться';
        setField(win, doc, '#headline', originalHeadline);
        setField(win, doc, '#benefits', originalBenefits);
        setField(win, doc, '#description', '   ');
        setCheck(win, doc, '#showDescription', false);
        click(doc, '#makeShortBtn');
        await waitFor(() => doc.getElementById('statusLine')?.textContent.includes('сокращать пока нечего'), 1000, 'для пустого описания не показано объяснение');
        assert((doc.getElementById('description')?.value || '').trim() === '', 'пустое описание было неожиданно заполнено');
        assert(doc.getElementById('headline')?.value === originalHeadline, 'пустое сокращение изменило заголовок');
        assert(doc.getElementById('benefits')?.value === originalBenefits, 'пустое сокращение изменило преимущества');
        assert(doc.getElementById('showDescription')?.checked === false, 'пустое сокращение включило блок описания');
        assert(doc.activeElement?.id === 'description', 'после объяснения фокус не перешёл в описание');
        pass('текст: пустое описание получает объяснение и фокус');

        lastAction = 'text.shorten-already-short';
        const shortDescription = 'Короткое описание уже готово.';
        setField(win, doc, '#description', shortDescription);
        setCheck(win, doc, '#showDescription', false);
        click(doc, '#makeShortBtn');

        try{
          doc.querySelectorAll('#printSheet .flyer')[1].querySelector('[data-preview-control="photoTwo"]').click();
          assert(pickerRequests === 1, 'клик по фото второй копии не открыл нужный исходный файл');
          const control = doc.querySelector('#printSheet [data-preview-control="photoTwo"]');
          control.dispatchEvent(new win.KeyboardEvent('keydown', {key:'Enter', bubbles:true, cancelable:true}));
          assert(pickerRequests === 2, 'фото недоступно с клавиатуры');
          const headline = doc.querySelector('#printSheet [data-inline-field="headline"]');
          headline.focus();
          headline.textContent = 'ТЕСТ ПЕРЕД ЗАМЕНОЙ ФОТО';
          control.dispatchEvent(new win.PointerEvent('pointerdown', {button:0, bubbles:true, cancelable:true}));
          control.dispatchEvent(new win.PointerEvent('pointerup', {button:0, bubbles:true, cancelable:true}));
          assert(pickerRequests === 3, 'переход из текста к фото потерял нажатие');
          assert(doc.getElementById('headline').value === 'ТЕСТ ПЕРЕД ЗАМЕНОЙ ФОТО', 'замена фото потеряла незавершённый текст');
          assert(doc.querySelectorAll('#printSheet .photo-box img').length === 4, 'открытие выбора файла удалило исходные фото');
        } finally { photoTwo.click = originalPhotoClick; }
        setCheck(win, doc, '#showQr', true);
        setField(win, doc, '#qrLink', 'https://example.com/preview-test');
        await waitFor(() => doc.querySelector('#printSheet [data-preview-control="qr"]'), 2000, 'QR не появился');
        doc.querySelector('#printSheet [data-preview-control="qr"]').click();
        await waitFor(() => doc.activeElement === doc.getElementById('qrLink'), 2000, 'клик по QR не открыл ссылку для редактирования');
        const firstFlyer = doc.querySelector('#printSheet .flyer');
        assert([...firstFlyer.querySelectorAll('[data-preview-control]')].every(node => node.tabIndex === 0), 'медиа первой копии недоступны с клавиатуры');
        assert([...doc.querySelectorAll('#printSheet .flyer')].slice(1).flatMap(flyer => [...flyer.querySelectorAll('[data-preview-control]')]).every(node => node.tabIndex === -1), 'повторные копии медиа попали в Tab-путь');
        assert(doc.getElementById('agentPhone').value === profilePhone && doc.querySelectorAll('#printSheet .flyer').length === 2, 'редактирование медиа заменило профиль или формат');
        pass('предпросмотр: фото открывает свой файл, QR открывает свою ссылку');
        click(doc, '#spnJumpToPrintBtn');
        await waitFor(() => doc.body.dataset.wizardStep === 'check' && doc.activeElement === doc.getElementById('qualityBtn'), 2500, 'К печати не открыл проверку после редактирования');
        assert(!doc.getElementById('printDialog').open, 'К печати обошёл проверку и открыл печать');
        pass('предпросмотр: К печати открывает проверку без системной печати');

        if(runtimeErrors.length) throw new Error(`runtime errors: ${runtimeErrors.join(' | ')}`);
        lastAction = 'completed';
        result.dataset.status = 'passed';
        result.textContent = `PASSED\n${checks.map(item => `✓ ${item}`).join('\n')}`;
      }
      catch(error) {
        result.dataset.status = 'failed';
        result.dataset.lastAction = lastAction;
        result.textContent = `FAILED\n${checks.map(item => `✓ ${item}`).join('\n')}\n✗ ${error.message || error}\nПоследнее действие: ${lastAction}\nСостояние: ${JSON.stringify(snapshot(doc))}`;
      }
    }, {once:true});

    frame.src = '/index.html?smoke=ui-actions';

    window.setTimeout(() => {
      if(result.dataset.status === 'pending'){
        result.dataset.status = 'failed';
        result.dataset.lastAction = lastAction;
        result.textContent = `FAILED\n${checks.map(item => `✓ ${item}`).join('\n')}\n✗ общий timeout UI actions smoke\nПоследнее действие: ${lastAction}`;
      }
    }, 38000);

    function pass(message){ checks.push(message); }
    function assert(condition, message){ if(!condition) throw new Error(message); }
    function click(doc, selector){
      const element = doc.querySelector(selector);
      assert(element, `не найден элемент ${selector}`);
      element.click();
    }
    function setField(win, doc, selector, value){
      const input = doc.querySelector(selector);
      assert(input, `не найден элемент ${selector}`);
      input.value = value;
      input.dispatchEvent(new win.Event('input', {bubbles:true}));
      input.dispatchEvent(new win.Event('change', {bubbles:true}));
    }
    function setCheck(win, doc, selector, checked){
      const input = doc.querySelector(selector);
      assert(input, `не найден элемент ${selector}`);
      input.checked = checked;
      input.dispatchEvent(new win.Event('change', {bubbles:true}));
    }
    async function setFile(win, doc, selector, name, content, type='image/svg+xml'){
      const input = doc.querySelector(selector);
      assert(input, `не найден элемент ${selector}`);
      const transfer = new win.DataTransfer();
      transfer.items.add(new win.File([content], name, {type}));
      input.files = transfer.files;
      input.dispatchEvent(new win.Event('change', {bubbles:true}));
      await waitFor(() => input.files?.length === 1, 1000, `файл ${name} не выбран`);
    }
    function installDownloadCapture(win){
      const originalCreateObjectURL = win.URL.createObjectURL;
      const originalRevokeObjectURL = win.URL.revokeObjectURL;
      const originalAnchorClick = win.HTMLAnchorElement.prototype.click;
      const capture = {blob:null, filename:'', href:''};
      win.URL.createObjectURL = blob => { capture.blob = blob; return 'blob:etagi-ui-actions-smoke'; };
      win.URL.revokeObjectURL = () => {};
      win.HTMLAnchorElement.prototype.click = function(){
        capture.filename = this.download || '';
        capture.href = this.href || '';
      };
      capture.restore = () => {
        win.URL.createObjectURL = originalCreateObjectURL;
        win.URL.revokeObjectURL = originalRevokeObjectURL;
        win.HTMLAnchorElement.prototype.click = originalAnchorClick;
      };
      return capture;
    }
    function snapshot(doc){
      const value = id => doc.getElementById(id)?.value || '';
      return {
        status:doc.getElementById('statusLine')?.textContent || '',
        agentName:value('agentName'),
        agentPhone:value('agentPhone'),
        layoutName:value('layoutName'),
        savedLayout:value('savedLayouts'),
        headline:value('headline'),
        area:value('area'),
        price:value('price'),
        description:value('description'),
        benefits:value('benefits'),
        customBlockText:value('customBlockText'),
        qrLink:value('qrLink'),
        contactCta:value('contactCtaText'),
        tearOffLabel:value('tearOffLabel'),
        showDescription:Boolean(doc.getElementById('showDescription')?.checked),
        showBenefits:Boolean(doc.getElementById('showBenefits')?.checked),
        showCustomBlock:Boolean(doc.getElementById('showCustomBlock')?.checked),
        photoMode:doc.querySelector('[data-photo].active')?.dataset.photo || '',
        printCount:doc.querySelector('[data-count].active')?.dataset.count || '',
        photoImages:doc.querySelectorAll('#printSheet .photo-box img').length,
        hasQr:Boolean(doc.querySelector('#printSheet .qr-row'))
      };
    }
    async function waitFor(predicate, timeout, message){
      const started = Date.now();
      while(Date.now() - started < timeout){
        if(predicate()) return;
        await new Promise(resolve => setTimeout(resolve, 80));
      }
      throw new Error(typeof message === 'function' ? message() : message);
    }
  </script>
</body>

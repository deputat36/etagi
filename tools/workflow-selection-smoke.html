<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Etagi workflow selection smoke</title>
  <style>body{font-family:Arial,sans-serif;margin:16px}iframe{width:1280px;height:900px;border:1px solid #cbd5e1}pre{white-space:pre-wrap;padding:12px;background:#f8fafc}</style>
</head>
<body>
  <pre id="workflowSelectionSmokeResult" data-status="pending">Workflow selection smoke is running…</pre>
  <iframe id="appFrame" title="Генератор расклеек"></iframe>
  <script>
    const result = document.getElementById('workflowSelectionSmokeResult');
    const frame = document.getElementById('appFrame');
    const checks = [];
    let lastAction = 'startup';

    frame.addEventListener('load', async () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      let explicitTemplateClicks = 0;
      try{
        await waitFor(() => doc.querySelectorAll('.tpl-card').length > 0, 12000, 'шаблоны не появились');
        await waitFor(() => doc.body.dataset.taskSelectionConfirmed && doc.body.dataset.templateSelectionConfirmed, 3000, 'контекст подтверждения не инициализирован');
        assert(doc.body.dataset.taskSelectionConfirmed === 'false', 'стартовая задача ошибочно считается подтверждённой');
        assert(doc.body.dataset.templateSelectionConfirmed === 'false', 'стартовый шаблон ошибочно считается подтверждённым');
        assert(doc.querySelector('[data-template-preview-notice]'), 'для стартового шаблона нет пояснения предпросмотра');
        assert(!doc.querySelector('[data-selected-template-next]'), 'до явного выбора показано ложное «Шаблон выбран»');
        assert(!doc.querySelector('[data-template-recommended-hero]'), 'до явного выбора задачи показана рекомендация шаблона');
        await waitFor(() => doc.getElementById('spnClarityGoalContext'), 3000, 'контекст маршрута не появился');
        assert(doc.getElementById('spnClarityGoalContext')?.textContent.trim() === 'Не выбрана', 'маршрут приписал пользователю стартовую задачу');
        assert(doc.getElementById('spnClarityTemplateContext')?.textContent.includes('Предпросмотр'), 'маршрут не объясняет стартовый шаблон');
        assert(doc.getElementById('spnNextActionText')?.textContent.includes('Выберите задачу'), 'маршрут не предлагает сначала подтвердить задачу');
        pass('старт: технические задача и шаблон показаны как предпросмотр, а не как выбор');

        const firstAdaptationInfo = doc.querySelector('.tpl-card .tpl-adaptation-info');
        assert(firstAdaptationInfo, 'в карточке шаблона нет краткой информации по адаптации');
        assert(firstAdaptationInfo.textContent.includes('Заполнить:'), 'карточка не объясняет, что нужно заполнить');
        assert(firstAdaptationInfo.textContent.includes('на А4'), 'карточка не показывает рекомендуемый формат печати');
        assert(!firstAdaptationInfo.querySelector('button, input, select, textarea, a'), 'информация по адаптации добавила лишний интерактивный элемент в карточку');
        pass('карточка: заранее показывает объём адаптации и формат без нового действия');
        await waitFor(() => doc.getElementById('spnWizard'), 5000, 'офисный подбор не появился');
        click(doc, '[data-spn-ui-mode="advanced"]');
        await waitFor(() => doc.body.dataset.spnUiMode === 'advanced', 3000, 'расширенный режим не включился');

        const initialLayoutName = value(doc, 'layoutName');
        const initialHeadline = value(doc, 'headline');
        doc.getElementById('templateList').addEventListener('click', event => {
          if(event.target.closest('[data-template]')) explicitTemplateClicks += 1;
        }, true);

        lastAction = 'situation.tellerman-sad';
        click(doc, '[data-spn-situation="tellerman-sad"]');
        await waitFor(() => doc.querySelector('[data-spn-situation="tellerman-sad"]')?.classList.contains('active'), 3000, 'ситуация не стала активной');
        await waitFor(() => doc.querySelector('[data-goal="newbuild"]')?.classList.contains('active'), 3000, 'задача newbuild не выбрана одной транзакцией');
        await waitFor(() => value(doc, 'templateSearch') === 'Теллерманов сад новостройка семейная ипотека материнский капитал', 3000, 'поиск ситуации не подставлен');
        await waitFor(() => doc.querySelector('[data-count="2"]')?.classList.contains('active'), 3000, 'рекомендуемый формат 2 на А4 не применён');
        await waitFor(() => doc.querySelector('[data-layout-mode="newbuild_visual"]')?.classList.contains('active'), 3000, 'рекомендуемая компоновка не применена');
        assert(explicitTemplateClicks === 0, 'ситуация сгенерировала пользовательский клик по карточке шаблона');
        assert(value(doc, 'layoutName') === initialLayoutName, 'ситуация заменила название текущего макета');
        assert(value(doc, 'headline') === initialHeadline, 'ситуация заменила текст текущего макета');
        assert(doc.querySelector('[data-scenario="newbuild"]')?.classList.contains('active'), 'ситуация не выбрала сценарий Новостройки автоматически');
        assert(!doc.querySelector('#templateList [data-template].active'), 'до явного выбора неожиданно остался активный шаблон');
        assert(doc.getElementById('statusLine')?.textContent.includes('Текущий текст сохранён'), 'пользователь не получил объяснение сохранности текста');
        assert(doc.body.dataset.taskSelectionConfirmed === 'true', 'явная офисная ситуация не подтвердила задачу');
        assert(doc.body.dataset.templateSelectionConfirmed === 'false', 'офисная ситуация ошибочно подтвердила шаблон');
        assert(doc.getElementById('spnClarityGoalContext')?.textContent.trim() !== 'Не выбрана', 'маршрут не показал подтверждённую задачу');
        assert(doc.getElementById('spnClarityTemplateContext')?.textContent.includes('Не выбран'), 'маршрут не требует шаблон после выбора ситуации');
        pass('ситуация: задача, поиск и настройки применены одной транзакцией');
        pass('ситуация: текущий макет не заменён и активный шаблон не скрыт');

        lastAction = 'scenario.additional-filter';
        const beforeScenarioLayout = value(doc, 'layoutName');
        click(doc, '[data-scenario="all"]');
        await waitFor(() => doc.querySelector('[data-scenario="all"]')?.classList.contains('active'), 2000, 'дополнительный фильтр Все не стал активным');
        assert(value(doc, 'layoutName') === beforeScenarioLayout, 'сценарный фильтр неожиданно заменил макет');
        assert(explicitTemplateClicks === 0, 'сценарный фильтр вызвал клик по шаблону');
        pass('сценарий: остаётся дополнительным фильтром и не применяет шаблон');

        lastAction = 'template.explicit';
        const firstVisibleTemplate = doc.querySelector('#templateList [data-template]');
        assert(firstVisibleTemplate, 'после фильтров не осталось доступного шаблона');
        const explicitTemplateId = firstVisibleTemplate.dataset.template;
        firstVisibleTemplate.click();
        await waitFor(() => doc.querySelector(`[data-template="${cssEscape(explicitTemplateId)}"]`)?.classList.contains('active'), 3000, 'явно выбранная карточка не стала активной');
        assert(explicitTemplateClicks === 1, `ожидался один явный клик по шаблону, получено ${explicitTemplateClicks}`);
        assert(doc.querySelector('[data-goal="newbuild"]')?.classList.contains('active'), 'выбранный шаблон не синхронизировал задачу');
        assert(doc.querySelector('[data-scenario="newbuild"]')?.classList.contains('active'), 'выбранный шаблон не синхронизировал сценарий Новостройки');
        assert(doc.body.dataset.taskSelectionConfirmed === 'true', 'выбор шаблона потерял подтверждение задачи');
        assert(doc.body.dataset.templateSelectionConfirmed === 'true', 'явный клик не подтвердил шаблон');
        assert(!doc.querySelector('[data-template-preview-notice]'), 'после явного выбора осталось сообщение предпросмотра');
        assert(doc.getElementById('spnClarityTemplateContext')?.textContent.trim() !== 'Не выбран', 'маршрут не показал выбранный шаблон');
        pass('шаблон: применяется явно и синхронизирует сценарий');

        lastAction = 'adaptation.route-sync';
        const clarityDataStep = doc.querySelector('[data-clarity-target="#agentName"]');
        const adaptationChecklist = doc.getElementById('spnTextStepChecklist');
        assert(clarityDataStep && adaptationChecklist, 'маршрут или чек-лист адаптации не готовы');
        setField(win, doc, '#agentName', 'Анна Smoke');
        setField(win, doc, '#agentPhone', '+7 900 123-45-67');
        setField(win, doc, '#area', '');
        await waitFor(() => doc.getElementById('spnNextActionText')?.textContent.includes('Район / адрес / ЖК'), 2500, 'маршрут не назвал район первым незаполненным полем');
        assert(!clarityDataStep.classList.contains('done'), 'адаптация ошибочно готова при пустом районе');
        click(doc, '#spnGoNextActionBtn');
        await waitFor(() => doc.activeElement?.id === 'area', 2000, 'кнопка Перейти не сфокусировала конкретное незаполненное поле');

        const fieldValues = {
          agentName:'Анна Smoke',
          agentPhone:'+7 900 123-45-67',
          area:'Северный smoke',
          propertyType:'Квартира',
          price:'4 500 000 ₽',
          params:'2-комн., 48 м², 3/5 эт.',
          headline:'Тестовый заголовок',
          description:'Подробное тестовое описание выбранного шаблона.',
          benefits:'Тихий двор\nУдобный этаж',
          customBlockText:'Тестовое условие'
        };
        for(const item of [...adaptationChecklist.querySelectorAll('[data-text-step-field].todo')]){
          const fieldId = item.dataset.textStepField;
          if(fieldId && fieldValues[fieldId] !== undefined) setField(win, doc, `#${fieldId}`, fieldValues[fieldId]);
        }
        await waitFor(() => !adaptationChecklist.querySelector('[data-text-step-field].todo'), 3000, 'не удалось заполнить все релевантные пункты чек-листа');
        await waitFor(() => clarityDataStep.classList.contains('done'), 2500, 'маршрут не стал готовым после заполнения всего чек-листа');
        pass('адаптация: маршрут следует чек-листу и ведёт к первому незаполненному полю');

        lastAction = 'adaptation.complete-to-check';
        const adaptationNext = doc.getElementById('spnTextStepNextBtn');
        assert(adaptationNext && !adaptationNext.disabled, 'после заполнения адаптации кнопка следующего шага недоступна');
        assert(adaptationNext.textContent.includes('Перейти к проверке'), 'готовая адаптация не объясняет следующий шаг');
        const qualityBeforeTransition = doc.getElementById('qualityScore')?.textContent || '';
        adaptationNext.click();
        await waitFor(() => doc.body.dataset.wizardStep === 'check', 2500, 'готовая адаптация не открыла шаг проверки');
        await waitFor(() => doc.activeElement?.id === 'qualityBtn', 2500, 'после адаптации фокус не перешёл на кнопку проверки');
        assert((doc.getElementById('qualityScore')?.textContent || '') === qualityBeforeTransition, 'переход к проверке не должен автоматически запускать quality check');
        pass('адаптация: после заполнения ведёт к проверке без автоматического запуска');

        lastAction = 'template.adapt-next';
        const selectedNext = doc.querySelector('[data-selected-template-next]');
        const adaptButton = doc.querySelector('[data-adapt-selected-template]');
        assert(selectedNext && adaptButton, 'после выбора не появился понятный следующий шаг');
        assert(selectedNext.textContent.includes('Шаблон выбран'), 'подтверждение не объясняет, что шаблон уже применён');
        adaptButton.click();
        await waitFor(() => doc.body.dataset.wizardStep === 'content', 2000, 'кнопка Адаптировать не открыла шаг адаптации');
        await waitFor(() => ['agentName','agentPhone','area','headline','description'].includes(doc.activeElement?.id), 2000, 'после перехода фокус не попал в поле адаптации');
        assert(explicitTemplateClicks === 1, 'кнопка Адаптировать повторно применила карточку шаблона');
        pass('шаблон: подтверждение выбора ведёт прямо к адаптации без повторного применения');

        lastAction = 'mode.quick-hides-scenario';
        click(doc, '[data-spn-ui-mode="quick"]');
        await waitFor(() => doc.body.dataset.spnUiMode === 'quick', 2000, 'быстрый режим не включился');
        assert(win.getComputedStyle(doc.getElementById('scenarioFilterRow')).display === 'none', 'повторный сценарный выбор остался видимым в быстром режиме');
        assert(doc.querySelector('[data-scenario="newbuild"]')?.classList.contains('active'), 'быстрый режим потерял автоматический сценарий ситуации');
        assert(doc.getElementById('templateCountLine')?.textContent.includes('Подбор по ситуации: Новостройки'), 'быстрый режим не объясняет автоматический контекст');
        click(doc, '[data-spn-ui-mode="advanced"]');
        await waitFor(() => doc.body.dataset.spnUiMode === 'advanced', 2000, 'расширенный режим не вернулся');
        assert(win.getComputedStyle(doc.getElementById('scenarioFilterRow')).display !== 'none', 'дополнительный фильтр не вернулся в расширенном режиме');
        pass('режимы: повторный сценарный выбор скрыт в простом пути');

        lastAction = 'task.manual';
        const beforeTaskLayout = value(doc, 'layoutName');
        const beforeTaskHeadline = value(doc, 'headline');
        click(doc, '[data-goal="buyer"]');
        await waitFor(() => doc.querySelector('[data-goal="buyer"]')?.classList.contains('active'), 2000, 'ручная задача Покупатель не стала активной');
        assert(value(doc, 'layoutName') === beforeTaskLayout, 'ручной выбор задачи заменил название макета');
        assert(value(doc, 'headline') === beforeTaskHeadline, 'ручной выбор задачи заменил текст макета');
        assert(!doc.querySelector('#templateList [data-template].active'), 'ручной выбор задачи оставил скрытое активное выделение');
        assert(!doc.querySelector('[data-spn-situation].active'), 'ручная задача оставила несогласованную активную ситуацию');
        assert(doc.querySelector('[data-scenario="all"]')?.classList.contains('active'), 'ручная задача не сбросила дополнительный сценарий');
        assert(doc.body.dataset.taskSelectionConfirmed === 'true', 'ручная задача не зафиксирована как явный выбор');
        assert(doc.body.dataset.templateSelectionConfirmed === 'false', 'смена задачи не сбросила подтверждение шаблона');
        assert(doc.getElementById('spnClarityTemplateContext')?.textContent.includes('Не выбран'), 'маршрут не требует новый шаблон после смены задачи');
        pass('задача: фильтрует библиотеку без автоматического шаблона');

        lastAction = 'template.recommended-hero';
        const recommendedHero = doc.querySelector('[data-template-recommended-hero]');
        assert(recommendedHero, 'после явного выбора задачи не появился рекомендуемый шаблон');
        const recommendedTemplateId = recommendedHero.dataset.recommendedTemplate;
        assert(recommendedTemplateId, 'рекомендация не содержит templateId');
        const recommendedCard = doc.querySelector(`#templateList [data-template="${cssEscape(recommendedTemplateId)}"]`);
        assert(recommendedCard, 'рекомендуемый шаблон отсутствует в текущем каталоге');
        assert(recommendedHero.textContent.includes(recommendedCard.querySelector('b')?.textContent?.trim() || ''), 'hero и карточка показывают разные шаблоны');
        const recommendedButton = recommendedHero.querySelector('[data-use-recommended-template]');
        assert(recommendedButton, 'в рекомендации нет кнопки быстрого применения');
        const clicksBeforeRecommendation = explicitTemplateClicks;
        recommendedButton.click();
        await waitFor(() => doc.querySelector(`#templateList [data-template="${cssEscape(recommendedTemplateId)}"]`)?.classList.contains('active'), 3000, 'кнопка рекомендации не применила шаблон');
        assert(doc.body.dataset.templateSelectionConfirmed === 'true', 'рекомендация не подтвердила выбор шаблона');
        await waitFor(() => doc.body.dataset.wizardStep === 'content', 2000, 'рекомендация не открыла шаг адаптации');
        await waitFor(() => ['agentName','agentPhone','area','headline','description','benefits','price','params','propertyType','customBlockText'].includes(doc.activeElement?.id), 2000, 'рекомендация не сфокусировала поле адаптации');
        assert(explicitTemplateClicks === clicksBeforeRecommendation, 'кнопка рекомендации сгенерировала ложный пользовательский клик по карточке');
        assert(!doc.querySelector('[data-template-recommended-hero]'), 'после выбора рекомендация продолжает занимать место');
        pass('рекомендация: безопасный быстрый старт применяет шаблон без подмены клика по карточке');

        click(doc, '[data-goal="seller"]');
        await waitFor(() => doc.body.dataset.templateSelectionConfirmed === 'false', 2000, 'новая задача не сбросила подтверждение шаблона после рекомендации');

        lastAction = 'route.search-is-not-situation';
        click(doc, '[data-spn-reset]');
        await waitFor(() => !doc.querySelector('[data-spn-situation].active') && value(doc, 'templateSearch') === '', 3000, 'сброс ситуации не завершился');
        setField(win, doc, '#templateSearch', 'квартира');
        await waitFor(() => value(doc, 'templateSearch') === 'квартира', 2000, 'ручной поиск не применился');
        const situationStep = doc.querySelector('#spnRouteSteps span');
        assert(situationStep?.textContent.includes('Ситуация'), 'первый шаг маршрута имеет другое значение');
        assert(situationStep?.classList.contains('todo'), 'ручной поиск ошибочно закрыл шаг Ситуация');
        assert(doc.getElementById('spnRouteNext')?.textContent.includes('Начните с офисной ситуации'), 'маршрут не предлагает явно выбрать ситуацию');
        assert(!doc.querySelector('[data-spn-situation].active'), 'ручной поиск неожиданно выбрал офисную ситуацию');
        pass('маршрут: ручной поиск не подменяет явный выбор ситуации');

        result.dataset.status = 'passed';
        result.textContent = `PASSED\n${checks.map(item => `✓ ${item}`).join('\n')}`;
      } catch(error){
        result.dataset.status = 'failed';
        result.dataset.lastAction = lastAction;
        result.textContent = `FAILED\n${checks.map(item => `✓ ${item}`).join('\n')}\n✗ ${error.message || error}\nПоследнее действие: ${lastAction}\nСостояние: ${JSON.stringify(snapshot(doc, explicitTemplateClicks))}`;
      }
    }, {once:true});

    try{ localStorage.removeItem('etagi-raskleyka-selection-context-v1'); } catch(error){}
    frame.src = '/index.html?smoke=workflow-selection-audit';

    setTimeout(() => {
      if(result.dataset.status === 'pending'){
        result.dataset.status = 'failed';
        result.dataset.lastAction = lastAction;
        result.textContent = `FAILED\n✗ timeout\nПоследнее действие: ${lastAction}`;
      }
    }, 40000);

    function snapshot(doc, explicitTemplateClicks){
      return {
        activeSituation:doc.querySelector('[data-spn-situation].active')?.dataset.spnSituation || '',
        activeGoal:doc.querySelector('[data-goal].active')?.dataset.goal || '',
        activeScenario:doc.querySelector('[data-scenario].active')?.dataset.scenario || '',
        activeTemplate:doc.querySelector('[data-template].active')?.dataset.template || '',
        search:value(doc, 'templateSearch'),
        layoutName:value(doc, 'layoutName'),
        printCount:doc.querySelector('[data-count].active')?.dataset.count || '',
        layoutMode:doc.querySelector('[data-layout-mode].active')?.dataset.layoutMode || '',
        explicitTemplateClicks,
        route:doc.getElementById('spnRouteSteps')?.textContent || ''
      };
    }
    function value(doc, id){ return String(doc.getElementById(id)?.value || '').trim(); }
    function click(doc, selector){
      const element = doc.querySelector(selector);
      assert(element, `не найден ${selector}`);
      element.click();
    }
    function setField(win, doc, selector, value){
      const input = doc.querySelector(selector);
      assert(input, `не найден ${selector}`);
      input.value = value;
      input.dispatchEvent(new win.Event('input', {bubbles:true}));
      input.dispatchEvent(new win.Event('change', {bubbles:true}));
    }
    function cssEscape(value){ return window.CSS?.escape ? window.CSS.escape(value) : String(value).replace(/(["\\])/g, '\\$1'); }
    function pass(message){ checks.push(message); }
    function assert(condition, message){ if(!condition) throw new Error(message); }
    async function waitFor(predicate, timeout, message){
      const started = Date.now();
      while(Date.now() - started < timeout){
        if(predicate()) return;
        await new Promise(resolve => setTimeout(resolve, 80));
      }
      throw new Error(message);
    }
  </script>
</body>
</html>
